server {
    listen 80;
    server_name _;

    # Allow large room-image uploads (up to 10 x 100 MB per request).
    client_max_body_size 1024m;

    # Avoid stale HTML and assets while the UIs are being rebuilt.
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires off;
    }

    location = /staff {
        return 301 /staff/;
    }

    location /staff/ {
        proxy_pass http://staff:80/;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires off;
    }

    location / {
        set $customer_upstream customer;
        proxy_pass http://$customer_upstream:80;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires off;
    }
}
