spring.application.name=hotel-manager-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/hotel_manager?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:hotel_user}
spring.datasource.password=${DB_PASSWORD:hotel_password}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# JWT signing key must be kept stable between application restarts.
jwt.secret=${JWT_SECRET:VGhpc0lzQVN0YWJsZVNlY3JldEtleUZvckhvdGVsTWFuYWdlcl8yMDI2}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

admin.email=${ADMIN_EMAIL:admin@aurelia.com}
admin.password=${ADMIN_PASSWORD:admin123}
admin.first-name=${ADMIN_FIRST_NAME:System}
admin.last-name=${ADMIN_LAST_NAME:Administrator}

minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:${MINIO_ROOT_USER:minioadmin}}
minio.secret-key=${MINIO_SECRET_KEY:${MINIO_ROOT_PASSWORD:minioadmin}}
minio.bucket=${MINIO_BUCKET:aurelia}
minio.max-file-size=${MINIO_MAX_FILE_SIZE:5242880}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
